# /etc/nginx/sites-available/kunye-arsivi
# Kendi alan adinizi asagida degistirin, sonra:
#   sudo ln -s /etc/nginx/sites-available/kunye-arsivi /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS icin: sudo certbot --nginx -d kunye.alanadiniz.com

server {
    listen 80;
    server_name kunye.alanadiniz.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
