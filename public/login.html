<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Giriş — Künye Arşivi</title>
<link rel="stylesheet" href="/vendor/tailwind.css">
</head>
<body>
<div style="max-width:380px;margin:12vh auto 0;padding:0 20px;">
  <div style="text-align:center;margin-bottom:18px;">
    <h1 style="margin:0 0 4px;font-size:22px;font-weight:600;">🏷️ Künye Arşivi</h1>
    <p style="margin:0;font-size:14px;opacity:.65;">Devam etmek için giriş yapın.</p>
  </div>
  <div class="panel">
    <div class="search-box" style="flex-direction:column;">
      <label for="u" style="font-size:12.5px;opacity:.7;">Kullanıcı adı</label>
      <input id="u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus style="width:100%;box-sizing:border-box;">
    </div>
    <div class="search-box" style="flex-direction:column;">
      <label for="p" style="font-size:12.5px;opacity:.7;">Şifre</label>
      <input id="p" type="password" autocomplete="current-password" style="width:100%;box-sizing:border-box;">
    </div>
    <button class="printbtn" id="go" type="button">Giriş yap</button>
    <div class="status" id="msg" role="alert"></div>
  </div>
</div>
<script>
(function(){
  const u = document.getElementById('u'), p = document.getElementById('p');
  const go = document.getElementById('go'), msg = document.getElementById('msg');
  async function login(){
    if(!u.value.trim() || !p.value){ msg.textContent = 'Kullanıcı adı ve şifre gerekli.'; msg.className = 'status err'; return; }
    go.disabled = true; msg.textContent = ''; msg.className = 'status';
    try{
      const res = await fetch('/api/login', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ username: u.value, password: p.value })
      });
      const data = await res.json().catch(() => ({}));
      if(res.ok){ location.replace('/'); return; }
      msg.textContent = data.error || ('Hata: HTTP ' + res.status);
      msg.className = 'status err';
      p.value = ''; p.focus();
    }catch(e){
      msg.textContent = 'Sunucuya ulaşılamadı.'; msg.className = 'status err';
    }
    go.disabled = false;
  }
  go.addEventListener('click', login);
  [u, p].forEach(el => el.addEventListener('keydown', e => { if(e.key === 'Enter') login(); }));
})();
</script>
</body>
</html>
