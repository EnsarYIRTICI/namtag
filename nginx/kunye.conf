# Host'taki nginx: /etc/nginx/sites-available/kunye
#   ln -s /etc/nginx/sites-available/kunye /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#   HTTPS: certbot --nginx -d kunye.alanadiniz.com
# .env içindeki APP_ORIGIN bu alan adıyla (https://...) aynı olmalı.

server {
    listen 80;
    server_name kunye.alanadiniz.com;

    # Orijinal evrak (PDF/CSV/HTML) yüklemeleri için (MAX_UPLOAD_MB'den biraz büyük)
    client_max_body_size 30m;

    # API doğrudan Express'e
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # istemcinin gönderdiği başlığı ezer (sahtecilik önlemi)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arayüz Next.js'e
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
